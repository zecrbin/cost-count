server:
  port: 8081

spring:
  application:
    name: cost-count-backend

  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:info_cc}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:111111}

    hikari:
      pool-name: ${spring.application.name}-hikari
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-timeout: 30000
      validation-timeout: 5000
      keepalive-time: 120000

  sql:
    init:
      mode: never

  servlet:
    multipart:
      # 图标上传上限 2MB，由业务层给出中文提示；这里略放宽以便校验逻辑先执行。
      max-file-size: 3MB
      max-request-size: 4MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  file:
    name: logs/cost-count.log

  logback:
    rollingpolicy:
      file-name-pattern: logs/archive/cost-count.%d{yyyy-MM-dd}.%i.log.gz
      max-history: 30

  level:
    com.costcount: info

app:
  storage:
    # 运行时生成的账户图标目录，可通过环境变量覆盖。
    account-icon-dir: ${ACCOUNT_ICON_DIR:data/account-icons}
    # 用户上传的机构、账户图标目录，可通过环境变量覆盖。
    uploaded-icon-dir: ${UPLOADED_ICON_DIR:data/uploaded-icons}
