server:
  port: 8081

spring:
  application:
    name: cost-count-backend
  profiles:
    default: local
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 150MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  file:
    name: logs/cost-count.log
  logback:
    rollingpolicy:
      file-name-pattern: logs/archive/cost-count.%d{yyyy-MM-dd}.%i.log.gz
      max-history: 30
  level:
    com.costcount: info

app:
  ocr:
    # 每批图片启动一个 OCR Worker，整批识别后退出并释放模型和显存。
    python: ${OCR_PYTHON:python}
    script: ${OCR_SCRIPT:scripts/rapidocr.py}
    use-cuda: ${OCR_USE_CUDA:true}
    timeout-seconds: ${OCR_TIMEOUT_SECONDS:120}
