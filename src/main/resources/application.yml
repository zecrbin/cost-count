server:
  port: 8081

spring:
  application:
    name: cost-count-backend

  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${app.mysql.host}:${app.mysql.port}/${app.mysql.database}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${app.mysql.username}
    password: ${app.mysql.password}
    hikari:
      pool-name: ${spring.application.name}-hikari
      minimum-idle: ${app.mysql.min-idle}
      maximum-pool-size: ${app.mysql.max-pool-size}
      idle-timeout: ${app.mysql.idle-timeout-ms}
      max-lifetime: ${app.mysql.max-lifetime-ms}
      connection-timeout: ${app.mysql.connection-timeout-ms}
      validation-timeout: ${app.mysql.validation-timeout-ms}
      keepalive-time: ${app.mysql.keepalive-time-ms}

  sql:
    init:
      mode: never

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  mysql:
    host: ${MYSQL_HOST:127.0.0.1}
    port: ${MYSQL_PORT:3306}
    database: ${MYSQL_DATABASE:cost_count}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:111111}
    min-idle: ${MYSQL_MIN_IDLE:5}
    max-pool-size: ${MYSQL_MAX_POOL_SIZE:20}
    idle-timeout-ms: ${MYSQL_IDLE_TIMEOUT_MS:600000}
    max-lifetime-ms: ${MYSQL_MAX_LIFETIME_MS:1800000}
    connection-timeout-ms: ${MYSQL_CONNECTION_TIMEOUT_MS:30000}
    validation-timeout-ms: ${MYSQL_VALIDATION_TIMEOUT_MS:5000}
    keepalive-time-ms: ${MYSQL_KEEPALIVE_TIME_MS:120000}

logging:
  file:
    name: logs/cost-count.log
  logback:
    rollingpolicy:
      file-name-pattern: logs/archive/cost-count.%d{yyyy-MM-dd}.%i.log.gz
      max-history: 30
  level:
    com.costcount: info
