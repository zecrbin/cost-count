spring:
  config:
    activate:
      on-profile: local
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driver-class-name: org.h2.Driver
    url: ${app.h2.url}
    username: ${app.h2.username}
    password: ${app.h2.password}
    hikari:
      pool-name: ${spring.application.name}-hikari
      minimum-idle: ${app.h2.min-idle}
      maximum-pool-size: ${app.h2.max-pool-size}
      idle-timeout: ${app.h2.idle-timeout-ms}
      max-lifetime: ${app.h2.max-lifetime-ms}
      connection-timeout: ${app.h2.connection-timeout-ms}
      validation-timeout: ${app.h2.validation-timeout-ms}
      keepalive-time: ${app.h2.keepalive-time-ms}
  sql:
    init:
      mode: always
      encoding: UTF-8
  h2:
    console:
      enabled: true
      path: /h2-console

app:
  h2:
    url: ${H2_URL:jdbc:h2:file:./data/cost-count;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE}
    username: ${H2_USERNAME:sa}
    password: ${H2_PASSWORD:}
    min-idle: ${H2_MIN_IDLE:2}
    max-pool-size: ${H2_MAX_POOL_SIZE:10}
    idle-timeout-ms: ${H2_IDLE_TIMEOUT_MS:600000}
    max-lifetime-ms: ${H2_MAX_LIFETIME_MS:1800000}
    connection-timeout-ms: ${H2_CONNECTION_TIMEOUT_MS:30000}
    validation-timeout-ms: ${H2_VALIDATION_TIMEOUT_MS:5000}
    keepalive-time-ms: ${H2_KEEPALIVE_TIME_MS:120000}
